# Aggiorna la griglia "Ultimi lavori" dai post Instagram.
#
# Catena: Apify esegue lo scraper a calendario -> questo workflow legge
# l'ULTIMO run riuscito, scarica le immagini, le ottimizza e le committa.
#
# Niente webhook fra i due: il workflow parte qualche ora dopo e chiede a Apify
# l'ultimo run con status=SUCCEEDED. Un pezzo in meno che si puo' rompere, e se
# lo scraper fallisce il workflow trova comunque l'ultimo buono.
#
# Serve il secret APIFY_TOKEN nelle impostazioni del repo.
#
# La griglia si scrive al build: dopo il commit bisogna ridistribuire. Un push
# fatto con GITHUB_TOKEN NON fa partire il workflow di deploy (GitHub lo
# impedisce per evitare catene infinite), quindi lo si lancia a mano.

name: Ultimi lavori

on:
  schedule:
    # il 1 e il 15 alle 06:00 UTC: ogni due settimane circa. Cron non sa dire
    # "ogni 14 giorni", e due date fisse al mese sono piu' prevedibili.
    - cron: '0 6 1,15 * *'
  workflow_dispatch:        # per lanciarlo a mano dopo un post importante

permissions:
  contents: write
  actions: write       # per lanciare il deploy dopo il commit

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Scarica i post e ricostruisci la griglia
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/build-lavori.mjs --apify --limit 18

      - name: Committa solo se e' cambiato qualcosa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "startruck-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/lavori src/data/lavori.json
          # con una cadenza di post bassa la maggior parte dei run non trova
          # nulla di nuovo: in quel caso non si committa e non si ridistribuisce
          if git diff --staged --quiet; then
            echo "nessun post nuovo, niente da fare"
          else
            git commit -m "Aggiorna la griglia Ultimi lavori dai post Instagram"
            git push
            gh workflow run deploy-pages.yml --ref "${GITHUB_REF_NAME}"
          fi
